# Build the Windows installer from the private song data and publish it as a GitHub release.
# Started from the phone app (mobile/) or the Actions tab — no Mac needed.
# This repo is public, so the log must never print lyrics or titles: only counts.
name: Publish

on:
  workflow_dispatch:
    inputs:
      note:
        description: Release note (e.g. "2 new songs in New Life Kathmandu")
        required: false
        default: new songs
      dry_run:
        description: Test run — build everything but publish nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency: publish   # one release at a time

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Get song data (private repo)
        uses: actions/checkout@v5
        with:
          repository: Hemant-Gurung/songs-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: src/data

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild song list
        run: |
          node tools/parse_other.js > "$RUNNER_TEMP/songs.log"
          head -1 "$RUNNER_TEMP/songs.log"

      - name: Bump version
        id: version
        run: echo "v=$(npm version patch --no-git-tag-version | tr -d v)" >> "$GITHUB_OUTPUT"

      - name: Build and publish installer
        run: npx electron-builder --win --publish ${{ inputs.dry_run && 'never' || 'always' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release.json tells the phone app which song-data commit is live, so it can show what's unpublished
      - name: Commit version
        if: ${{ !inputs.dry_run }}
        env:
          NOTE: ${{ inputs.note }}
          V: ${{ steps.version.outputs.v }}
        run: |
          printf '{ "version": "%s", "data": "%s" }\n' "$V" "$(git -C src/data rev-parse HEAD)" > release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json release.json
          git commit -m "Release $V: $NOTE"
          git pull --rebase
          git push
